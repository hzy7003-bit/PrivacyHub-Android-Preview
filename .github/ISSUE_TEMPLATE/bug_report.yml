name: Bug 报告
description: 报告可重复出现的功能异常
title: "[Bug] "
body:
  - type: markdown
    attributes:
      value: |
        请先删除截图和日志中的账号、设备码、激活码、安全箱正文及其他个人信息。
  - type: input
    id: version
    attributes:
      label: App 版本
      placeholder: 例如 v0.9.27-beta Release
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: 设备与系统
      placeholder: 品牌、型号、Android 版本、ROM 版本
    validations:
      required: true
  - type: dropdown
    id: entry
    attributes:
      label: 使用入口
      options:
        - 通知栏保存
        - 保存并跳转
        - 系统分享
        - 长按文本
        - 控制中心磁贴
        - 安全箱
        - Pro 自动填充
        - Pro 网盘提取码辅助
        - 其他
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      placeholder: 请按顺序描述每一步操作
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: 实际结果
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 预期结果
    validations:
      required: true
  - type: textarea
    id: diagnostics
    attributes:
      label: 脱敏诊断信息
      description: 可粘贴失败原因或拖入已脱敏截图，请勿包含保存正文。
  - type: checkboxes
    id: privacy
    attributes:
      label: 隐私确认
      options:
        - label: 我已移除个人信息、安全箱正文、设备码、激活码和 License。
          required: true
